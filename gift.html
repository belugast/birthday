<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Gift 🎁</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    overflow-x:hidden;
    text-align:center;
    padding:20px;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:clamp(2rem,6vw,3.2rem);
    line-height:1.3;
}

.gift{
    font-size:clamp(7rem,25vw,11rem);
    cursor:pointer;
    transition:.4s;
    user-select:none;
}

.gift:hover{
    transform:scale(1.12) rotate(10deg);
}

.message{
    display:none;
    margin-top:30px;
    font-size:clamp(1.1rem,3vw,1.8rem);
    color:black;
    animation:fade 1.2s;
    padding:20px;
    max-width:700px;
    line-height:1.7;
}

a{
    text-decoration:none;
}

button{
    margin-top:40px;
    padding:15px 40px;
    border:none;
    border-radius:40px;
    background:#ff4081;
    color:white;
    font-size:clamp(1rem,3vw,1.2rem);
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:hover{
    transform:scale(1.08);
    background:#ff1e70;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.confetti{
    position:fixed;
    font-size:25px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* Mobile Responsive */
@media (max-width:600px){

    body{
        padding:20px 15px;
    }

    h1{
        font-size:2rem;
    }

    .gift{
        font-size:7rem;
    }

    .message{
        font-size:1.05rem;
        padding:15px;
        line-height:1.8;
    }

    button{
        width:100%;
        max-width:260px;
        padding:15px;
    }

    .confetti{
        font-size:20px;
    }

}

</style>

</head>

<body>

<h1 style="color:#000;">🎁 Click the Gift 🎁</h1>

<div class="gift" onclick="openGift()">
🎁
</div>

<div class="message" id="msg">

🎉 <strong style="color:#000;">Surprise!</strong> 🎉

<br><br>

You deserve all the happiness, love, and success in the world.

<br><br>

Never stop smiling because your smile makes everything brighter. ❤️

</div>

<a href="final.html">
<button>Next ➜</button>
</a>

<script>

let opened = false;

function openGift(){

    if(opened) return;

    opened = true;

    document.querySelector(".gift").innerHTML = "💝";

    document.getElementById("msg").style.display = "block";

    for(let i = 0; i < 120; i++){

        let c = document.createElement("div");

        c.className = "confetti";

        c.innerHTML = ["🎉","✨","🎊","💖","🌸"][Math.floor(Math.random()*5)];

        c.style.left = Math.random()*100 + "vw";

        c.style.animationDuration = (3 + Math.random()*2) + "s";

        document.body.appendChild(c);

        setTimeout(() => c.remove(), 5000);
    }

}

</script>

</body>
</html>
