<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    text-align:center;
    z-index:2;
}

h1{
    color:#fff;
    font-size:clamp(2.2rem,6vw,4rem);
    line-height:1.2;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
    animation:bounce 2s infinite;
}

p{
    margin:20px 0 30px;
    color:white;
    font-size:clamp(1rem,3vw,1.4rem);
    line-height:1.6;
    padding:0 10px;
}

a{
    text-decoration:none;
}

button{
    padding:16px 45px;
    font-size:clamp(1rem,3vw,1.2rem);
    border:none;
    border-radius:50px;
    background:#ff4081;
    color:white;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:hover{
    transform:scale(1.08);
    background:#ff1e70;
}

.balloons span{
    position:absolute;
    bottom:-150px;
    font-size:clamp(2rem,5vw,3.8rem);
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

@keyframes bounce{
    50%{
        transform:translateY(-15px);
    }
}

/* Mobile Responsive */
@media (max-width:600px){

    body{
        padding:15px;
    }

    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1.05rem;
        margin:18px 0 25px;
    }

    button{
        width:100%;
        max-width:280px;
        padding:16px;
        font-size:1.05rem;
    }

    .balloons span{
        font-size:2.2rem;
    }
}
</style>

</head>
<body>

<div class="balloons"></div>

<div class="container">

<h1 style="color:#000;">🎉 Happy Birthday<br>Shebah! 🎉</h1>

<p style="color:#000;">I prepared a special surprise just for you ❤️</p>

<a href="surprise.html">
    <button>Start Surprise 🎁</button>
</a>

</div>

<script>
const balloons = document.querySelector(".balloons");

for(let i = 0; i < 25; i++){

    let b = document.createElement("span");

    b.innerHTML = "🎈";

    b.style.left = Math.random() * 100 + "%";

    b.style.animationDuration = (4 + Math.random() * 5) + "s";

    b.style.animationDelay = (Math.random() * 5) + "s";

    balloons.appendChild(b);
}
</script>

</body>
</html>
